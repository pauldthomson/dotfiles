onboarding = false
# Herdr settings shared by this dotfiles repository.
# Symlink to ~/.config/herdr/config.toml, then reload with:
#   herdr server reload-config

[theme]
name = "catppuccin"

# Keep sidebar and pane separators visible against Catppuccin terminal panes.
[theme.custom]
surface_dim = "#313244"

[keys]
prefix = "ctrl+space"
detach = "prefix+d"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"

# Match the tmux session picker: fuzzy-search workspaces by name.
[[keys.command]]
key = "prefix+j"
type = "popup"
description = "switch workspace"
command = '''
herdr_bin="${HERDR_BIN_PATH:-herdr}"
selected=$(
  "$herdr_bin" workspace list |
    jq -r '.result.workspaces[] | [.label, .workspace_id] | @tsv' |
    fzf --reverse --cycle --delimiter='\t' --nth=1 --with-nth=1 --prompt='workspace> '
) || exit 0
[ -n "$selected" ] || exit 0
workspace_id=$(printf '%s\n' "$selected" | awk -F '\t' '{print $NF}')
"$herdr_bin" workspace focus "$workspace_id" >/dev/null
'''
width = "50%"
height = "50%"

# Match the tmux window picker: fuzzy-search tabs in the active workspace.
[[keys.command]]
key = "prefix+k"
type = "popup"
description = "switch tab"
command = '''
herdr_bin="${HERDR_BIN_PATH:-herdr}"
[ -n "${HERDR_ACTIVE_WORKSPACE_ID:-}" ] || exit 0
selected=$(
  "$herdr_bin" tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" |
    jq -r '.result.tabs[] | [.label, .tab_id] | @tsv' |
    fzf --reverse --delimiter='\t' --nth=1 --with-nth=1 --prompt='tab> '
) || exit 0
[ -n "$selected" ] || exit 0
tab_id=$(printf '%s\n' "$selected" | awk -F '\t' '{print $NF}')
"$herdr_bin" tab focus "$tab_id" >/dev/null
'''
width = "50%"
height = "50%"

# Pick a repository under ~/repos/<host>/<org>/<repo> and create a focused
# workspace rooted there, mirroring the ptmux project launcher.
[[keys.command]]
key = "prefix+ctrl+p"
type = "popup"
description = "create workspace from project"
command = '''
root="$HOME/repos"
[ -d "$root" ] || exit 0
selected=$(
  cd "$root" &&
    find . -mindepth 3 -maxdepth 3 -type d -print |
    sed 's#^\./##' |
    sort |
    fzf --prompt='project> '
) || exit 0
[ -n "$selected" ] || exit 0

project="$root/$selected"
herdr_bin="${HERDR_BIN_PATH:-herdr}"
workspace_id=""
cleanup_incomplete_workspace() {
  status=$?
  trap - EXIT
  if [ "$status" -ne 0 ] && [ -n "$workspace_id" ]; then
    "$herdr_bin" workspace close "$workspace_id" >/dev/null 2>&1 || true
  fi
  exit "$status"
}
trap cleanup_incomplete_workspace EXIT
trap 'exit 1' HUP INT TERM
set -eu

workspace=$(
  "$herdr_bin" workspace create \
    --cwd "$project" \
    --label "${selected##*/}" \
    --no-focus
)
workspace_id=$(printf '%s\n' "$workspace" | jq -er '.result.workspace.workspace_id')
nvim_tab_id=$(printf '%s\n' "$workspace" | jq -er '.result.tab.tab_id')
nvim_pane_id=$(printf '%s\n' "$workspace" | jq -er '.result.root_pane.pane_id')
"$herdr_bin" tab rename "$nvim_tab_id" nvim >/dev/null
"$herdr_bin" pane run "$nvim_pane_id" nvim >/dev/null

agent=$(
  "$herdr_bin" tab create \
    --workspace "$workspace_id" \
    --cwd "$project" \
    --label agent \
    --no-focus
)
agent_pane_id=$(printf '%s\n' "$agent" | jq -er '.result.root_pane.pane_id')
"$herdr_bin" pane run "$agent_pane_id" pi >/dev/null

"$herdr_bin" tab create \
  --workspace "$workspace_id" \
  --cwd "$project" \
  --label scratch \
  --no-focus >/dev/null

"$herdr_bin" workspace focus "$workspace_id" >/dev/null
"$herdr_bin" tab focus "$nvim_tab_id" >/dev/null
trap - EXIT HUP INT TERM
'''
width = "80%"
height = "80%"

[ui]
show_agent_labels_on_pane_borders = true
