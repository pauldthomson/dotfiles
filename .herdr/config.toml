onboarding = false
# Herdr settings shared by this dotfiles repository.
# Symlink to ~/.config/herdr/config.toml, then reload with:
#   herdr server reload-config

[theme]
name = "catppuccin"

# Keep sidebar and pane separators visible against Catppuccin terminal panes.
[theme.custom]
surface_dim = "#313244"

[keys]
prefix = "ctrl+space"
detach = "prefix+d"
reload_config = "prefix+r"
# The built-in resize-mode shortcut also uses prefix+r; move it to avoid a collision.
resize_mode = "prefix+shift+r"
# Route the close shortcut through the checkout cleanup prompt.
close_workspace = ""
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"

# Match tmux's prefix+Ctrl+L: forward Ctrl+L to the focused pane.
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
description = "clear screen"
command = '''
herdr_bin="${HERDR_BIN_PATH:-herdr}"
pane_id=$("$herdr_bin" pane current | jq -er '.result.pane.pane_id') || exit 1
"$herdr_bin" pane send-keys "$pane_id" ctrl+l
'''

# Match the tmux session picker: fuzzy-search workspaces by name.
[[keys.command]]
key = "prefix+j"
type = "popup"
description = "switch workspace"
command = '''
herdr_bin="${HERDR_BIN_PATH:-herdr}"
selected=$(
  "$herdr_bin" workspace list |
    jq -r '.result.workspaces[] | [.label, .workspace_id] | @tsv' |
    fzf --reverse --cycle --delimiter='\t' --nth=1 --with-nth=1 --prompt='workspace> '
) || exit 0
[ -n "$selected" ] || exit 0
workspace_id=$(printf '%s\n' "$selected" | awk -F '\t' '{print $NF}')
"$herdr_bin" workspace focus "$workspace_id" >/dev/null
'''
width = "50%"
height = "50%"

# Match the tmux window picker: fuzzy-search tabs in the active workspace.
[[keys.command]]
key = "prefix+k"
type = "popup"
description = "switch tab"
command = '''
herdr_bin="${HERDR_BIN_PATH:-herdr}"
[ -n "${HERDR_ACTIVE_WORKSPACE_ID:-}" ] || exit 0
selected=$(
  "$herdr_bin" tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" |
    jq -r '.result.tabs[] | [.label, .tab_id] | @tsv' |
    fzf --reverse --delimiter='\t' --nth=1 --with-nth=1 --prompt='tab> '
) || exit 0
[ -n "$selected" ] || exit 0
tab_id=$(printf '%s\n' "$selected" | awk -F '\t' '{print $NF}')
"$herdr_bin" tab focus "$tab_id" >/dev/null
'''
width = "50%"
height = "50%"

# Resolve the script through the symlinked config file, not the popup's cwd.
[[keys.command]]
key = "prefix+ctrl+p"
type = "popup"
description = "open project or new JJ checkout"
command = '''
bash "$(dirname "$(realpath "${HERDR_CONFIG_PATH:-$HOME/.config/herdr/config.toml}")")/project-workspace" open
'''
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+d"
type = "popup"
description = "close workspace and offer JJ checkout cleanup"
command = '''
bash "$(dirname "$(realpath "${HERDR_CONFIG_PATH:-$HOME/.config/herdr/config.toml}")")/project-workspace" close
'''
width = "80%"
height = "40%"

# Herdr Annotate: terminal annotations and Plannotator TUI document review.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
